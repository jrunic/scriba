[project]
name = "scriba"
version = "0.2.1"
description = "CLI for Microsoft Graph — read/draft email, read/create calendar events, delegated auth"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Jedi Labs" }]
dependencies = [
    "O365>=2.0.37",
    "typer>=0.15",
    "rich>=13.0",
    "tomli-w>=1.0",
    "msal-extensions==1.3.1",
]

[project.scripts]
scriba = "scriba.main:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
